# Holt die Marktdaten, baut das Dashboard und veröffentlicht es auf GitHub Pages.
# Läuft zeitgesteuert, bei jedem Push auf main und manuell ("Run workflow").
name: Dashboard aktualisieren

on:
  push:
    branches: [main]
  schedule:
    # Werktags stündlich von 06:23 bis 21:23 UTC (Zeitpläne laufen nur auf dem Standard-Branch).
    - cron: '23 6-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Daten abrufen (Bigdata.com, EZB)
        run: npm run fetch-data
        env:
          BIGDATA_API_KEY: ${{ secrets.BIGDATA_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
