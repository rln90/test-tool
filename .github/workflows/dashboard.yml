# Holt die Marktdaten, baut das Dashboard und veröffentlicht es auf GitHub Pages.
# Läuft stündlich (Mo–Fr rund um die Uhr), bei jedem Push auf main und auf Aufforderung
# (Button „Jetzt abrufen“ im Dashboard oder Actions → „Dashboard aktualisieren“ → Run workflow).
name: Dashboard aktualisieren

on:
  push:
    branches: [main]
  schedule:
    # Minute 7 statt 0, weil GitHub zur vollen Stunde stark ausgelastet ist.
    # Zeitpläne laufen nur auf dem Standard-Branch (main).
    - cron: '7 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Daten abrufen (Yahoo Finance, EZB)
        run: npm run fetch-data
        env:
          # Bei Ausfall einer Quelle wird der zuletzt veröffentlichte Stand übernommen.
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/marketdata.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
